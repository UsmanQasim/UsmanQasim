<svg xmlns="http://www.w3.org/2000/svg" width="600" height="687.1499999999999" viewBox="0 0 600 687.1499999999999" role="img"><style>@font-face{font-family:D8;src:url(data:font/woff2;base64,) format('woff2')}.D8{font-family:D8,ui-monospace,sans-serif}@font-face{font-family:D6;src:url(data:font/woff2;base64,) format('woff2')}.D6{font-family:D6,ui-monospace,sans-serif}@font-face{font-family:M7;src:url(data:font/woff2;base64,) format('woff2')}.M7{font-family:M7,ui-monospace,sans-serif}text{white-space:pre}</style><rect width="600" height="687.1499999999999" rx="22" fill="#ebe6f8"/><rect x="31" y="31" width="542" height="631.1499999999999" rx="14" fill="#16132b"/><rect x="26" y="26" width="542" height="631.1499999999999" rx="14" fill="#ffffff" stroke="#16132b" stroke-width="2.5"/><text x="90.0" y="66.0" class="D8" font-size="23" fill="#16132b">Head of Development</text><text x="90.0" y="94.0" class="M7" font-size="15" fill="#7c3aed">Forthlogic AI · Jul 2025 - now</text><text x="90.0" y="122.0" class="D6" font-size="17" fill="#5b5677">Lead the team behind Chatley AI. Built Ikora, the</text><text x="90.0" y="146.7" class="D6" font-size="17" fill="#5b5677">Chatley MCP server and live call streaming; CI/CD and</text><text x="90.0" y="171.3" class="D6" font-size="17" fill="#5b5677">code review cut production bugs 25%.</text><text x="90.0" y="222.0" class="D8" font-size="23" fill="#16132b">Frontend Developer, React/Next.js</text><text x="90.0" y="250.0" class="M7" font-size="15" fill="#7c3aed">A3E Systems · Aug 2024 - Feb 2025</text><text x="90.0" y="278.0" class="D6" font-size="17" fill="#5b5677">40+ reusable components (-35% frontend dev time),</text><text x="90.0" y="302.6" class="D6" font-size="17" fill="#5b5677">React Query caching and optimistic updates, API</text><text x="90.0" y="327.2" class="D6" font-size="17" fill="#5b5677">handling latency down 30%.</text><text x="90.0" y="377.9" class="D8" font-size="23" fill="#16132b">Frontend Lead, Full Stack</text><text x="90.0" y="405.9" class="M7" font-size="15" fill="#7c3aed">MTBS Route Trading · Jan 2021 - Jul 2025</text><text x="90.0" y="433.9" class="D6" font-size="17" fill="#5b5677">Led Next.js + ASP.NET architecture for enterprise apps;</text><text x="90.0" y="458.5" class="D6" font-size="17" fill="#5b5677">caching cut data retrieval times 70%; mentored junior</text><text x="90.0" y="483.2" class="D6" font-size="17" fill="#5b5677">developers.</text><text x="90.0" y="533.8" class="D8" font-size="23" fill="#16132b">BS Computer Science</text><text x="90.0" y="561.8" class="M7" font-size="15" fill="#7c3aed">PMAS University, Rawalpindi</text><text x="90.0" y="589.8" class="D6" font-size="17" fill="#5b5677">Team project leader, tech seminar participant and</text><text x="90.0" y="614.5" class="D6" font-size="17" fill="#5b5677">teaching assistant for core courses.</text><path d="M56 59V526.8499999999999" stroke="#16132b" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><circle cx="56" cy="59" r="9" fill="#c6f432" stroke="#16132b" stroke-width="2.5"/><circle cx="56" cy="214.95000000000002" r="9" fill="#e3d9ff" stroke="#16132b" stroke-width="2.5"/><circle cx="56" cy="370.9" r="9" fill="#e3d9ff" stroke="#16132b" stroke-width="2.5"/><rect x="47" y="517.8499999999999" width="18" height="18" rx="4" fill="#ffe7ad" stroke="#16132b" stroke-width="2.5"/></svg>